name: Native4 sale tests
on:
  push:
    branches: [native4-core-migration]
    paths:
      - 'native4/AlSafaNative4-Phase1/**'
      - '.github/workflows/native4-sale-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test Native4 sale guard
        working-directory: native4/AlSafaNative4-Phase1
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.alsafa.native4.core.SaleLineGuardTest'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native4-sale-test-reports
          path: native4/AlSafaNative4-Phase1/app/build/reports/tests/
          if-no-files-found: ignore
