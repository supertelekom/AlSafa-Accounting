name: Build Native 4 test APK

on:
  workflow_dispatch:
  push:
    branches: [native4-sync-core]
    paths:
      - "native4/AlSafaNative4-Phase1/app/build.gradle"
      - ".github/workflows/native4-debug.yml"
  pull_request:
    branches: [main]
    paths:
      - "native4/AlSafaNative4-Phase1/**"
      - ".github/workflows/native4-debug.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build separate Native 4 test package
        run: gradle -p native4/AlSafaNative4-Phase1 :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AlSafaNative4-test-debug
          path: native4/AlSafaNative4-Phase1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
