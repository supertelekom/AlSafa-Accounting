name: Native 6 verify
on:
  push:
    branches: [native6-development]
    paths:
      - 'native6/**'
      - '.github/workflows/native6-verify.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Unit tests and debug APK
        working-directory: native6
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alsafa-native6-debug
          path: native6/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native6-unit-test-results
          path: |
            native6/app/build/test-results/testDebugUnitTest/**
            native6/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
