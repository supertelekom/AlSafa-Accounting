name: Native 6 Android build
on:
  push:
    branches: [native6-development]
    paths:
      - 'native6/**'
      - '.github/workflows/native6-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: native6/**/*.gradle*
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload unit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alsafa-native6-test-reports
          path: |
            native6/app/build/test-results/testDebugUnitTest/
            native6/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: alsafa-native6-debug
          path: native6/app/build/outputs/apk/debug/*.apk
          retention-days: 7
