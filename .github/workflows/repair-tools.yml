name: Android repair tools
on:
  push:
    branches: [integration/product-journal-local]
    paths: ['.github/workflows/repair-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p repair-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" repair-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" repair-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" repair-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: android-repair-tools
          path: repair-tools/
