name: Native 6 Android build
on:
  push:
    branches: [native6-development]
    paths:
      - 'native6/**'
      - '.github/workflows/native6-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and test
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: alsafa-native6-debug
          path: native6/app/build/outputs/apk/debug/*.apk
          retention-days: 7
