plugins { id 'com.android.application' }

android {
    namespace 'com.alsafa.native4'
    compileSdk 34
    defaultConfig {
        applicationId 'com.alsafa.native4.test'
        minSdk 26
        targetSdk 33
        versionCode 40005
        versionName '4.0.3-local-sale-atomic-test'
    }
}

dependencies {
    // Kept only so the legacy FirebaseSync source still compiles. MainActivity
    // does not instantiate it, so this isolated test makes no Firebase calls.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
}
